    <script>
      // 首屏防闪白：在主 CSS / Vue 挂载之前就把主题 class 打到 <html> 上
      // 逻辑与 src/composables/useTheme.js 保持一致：
      // 只认新版主题 id，旧版的 dark / light 不再映射，统一落到默认「官方风」
      (function () {
        try {
          var saved = localStorage.getItem('theme-v2');
          if (saved !== 'official' && saved !== 'minimal' && saved !== 'tech') {
            saved = 'official';
          }
          var root = document.documentElement;
          root.classList.add('theme-' + saved);
          if (saved === 'tech') root.classList.add('dark');
          root.dataset.theme = saved;
          root.style.colorScheme = saved === 'tech' ? 'dark' : 'light';
        } catch (e) {}
      })();

/* ------------------------------------------------------------------
   顶部搜索框：固定宽度 + 禁止被 flex 拉伸 / 压缩（P1 布局修复）
   不跟随视口变宽，避免不同分辨率下被拉长、挤压导航与登录区。
   ------------------------------------------------------------------ */
.header-search-box {
  width: 240px;
  min-width: 240px;
  flex-shrink: 0;
}

/* ------------------------------------------------------------------
   卡片封面统一 16:9：容器按卡片宽度铺开，<img> 必须 cover 裁切居中，
   绝不拉伸变形；原图无论方/长/宽，都像海报一样填满整个封面位。
   详情页头图走 object-contain（宽度撑满、高度自适应、最高 400px），
   不套用本文件的 cover 规则，避免裁掉长图上的标题文字。
   兜底渐变同样铺满容器，切换真图/兜底时布局尺寸不跳动。
   ------------------------------------------------------------------ */
.cover-media {
  position: relative;
  overflow: hidden;
}

.cover-media > img {
  display: block;
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center;
     object-position: center;
}

/* ------------------------------------------------------------------
   无封面兜底：按赛事名色相生成的淡彩渐变 + 赛事首字
   卡片（16:9）与详情页（最高 300px 大图位）共用，避免灰白破图/空洞占位。
   色相由 src/utils/coverFallback.js 计算后通过 --cover-hue 传入。
   ------------------------------------------------------------------ */
.cover-fallback {
  position: relative;
  display: flex;
  height: 100%;
  width: 100%;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(120% 120% at 16% 10%, hsl(var(--cover-hue, 210) 88% 98% / 0.95), transparent 58%),
    linear-gradient(135deg,
      hsl(var(--cover-hue, 210) 68% 94%),
      hsl(calc(var(--cover-hue, 210) + 42) 62% 86%));
}

/* 右下角一层柔光，避免大色块太平 */
.cover-fallback::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(85% 85% at 82% 92%, rgb(255 255 255 / 0.55), transparent 62%);
  pointer-events: none;
}

.cover-fallback__glyph {
  position: relative;
  z-index: 1;
  font-size: clamp(2.5rem, 6vw, 3.4rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  color: hsl(var(--cover-hue, 210) 42% 30% / 0.9);
  text-shadow: 0 1px 0 rgb(255 255 255 / 0.55);
}

/* 2 字简称：字号略收、拉开字间距，两个字在色块中心视觉居中且不拥挤。
   margin-right 抵消最后一个字后的字间距，避免整体重心偏左。 */
.cover-fallback__glyph--short {
  font-size: clamp(1.8rem, 4.5vw, 2.35rem);
  letter-spacing: 0.14em;
  margin-right: -0.14em;
  white-space: nowrap;
}

/* 详情页大图位：字号更大、略降不透明度 */
.cover-fallback--hero .cover-fallback__glyph {
  font-size: clamp(4rem, 12vw, 6rem);
}

.cover-fallback--hero .cover-fallback__glyph--short {
  font-size: clamp(3rem, 8vw, 4.5rem);
  letter-spacing: 0.18em;
  margin-right: -0.18em;
}

/* 暗色模式：同色相压暗，保证与卡片底色协调 */
.dark .cover-fallback {
  background:
    radial-gradient(120% 120% at 16% 10%, hsl(var(--cover-hue, 210) 36% 30% / 0.9), transparent 58%),
    linear-gradient(135deg,
      hsl(var(--cover-hue, 210) 32% 22%),
      hsl(calc(var(--cover-hue, 210) + 42) 28% 16%));
}

.dark .cover-fallback__glyph {
  color: hsl(var(--cover-hue, 210) 60% 80% / 0.92);
  text-shadow: 0 1px 0 rgb(0 0 0 / 0.35);
}
