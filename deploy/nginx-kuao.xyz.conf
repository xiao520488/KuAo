# 库奥平台全站 HTTPS 站点配置
# 生效位置：/etc/nginx/sites-available/default
#           （/etc/nginx/sites-enabled/kuao.conf 是指向它的软链）
# 证书：阿里云免费证书，CN=www.kuao.xyz，SAN 含 www.kuao.xyz / kuao.xyz
#       到期 2027-02-15 07:59（北京时间），续期后覆盖 /etc/nginx/certs/ 下同名文件并 reload

# ---------- 80：全部永久跳转 HTTPS（统一落到 www） ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.kuao.xyz kuao.xyz _;

    return 301 https://www.kuao.xyz$request_uri;
}

# ---------- 443 裸域：kuao.xyz 永久跳转 www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kuao.xyz;

    ssl_certificate     /etc/nginx/certs/www.kuao.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/www.kuao.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.kuao.xyz$request_uri;
}

# ---------- 443：站点本体 + /api 反代 ----------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.kuao.xyz _;

    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/www.kuao.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/www.kuao.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    # HSTS 先不启用：证书只有 90 天，续期万一失败会被浏览器锁死。稳定后再开。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Vue SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 永不缓存：换前端包后刷新即生效（try_files 内部跳转也会落到这里）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 带内容哈希的静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}