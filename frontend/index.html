<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>库奥 - 大学生竞赛AI智库</title>
    <meta
      name="description"
      content="库奥 - 大学生竞赛AI智库：聚合大学生竞赛信息，提供 AI 语义搜索、获奖作品解析与全流程备赛攻略。"
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // 首屏防闪白：在主 CSS / Vue 挂载之前就把主题 class 打到 <html> 上
      // 逻辑与 src/composables/useTheme.js 保持一致：
      // 只认新版主题 id，旧版的 dark / light 不再映射，统一落到默认「官方风」
      (function () {
        try {
          var saved = localStorage.getItem('theme-v2');
          if (saved !== 'official' && saved !== 'minimal' && saved !== 'tech') {
            saved = 'official';
          }
          var root = document.documentElement;
          root.classList.add('theme-' + saved);
          if (saved === 'tech') root.classList.add('dark');
          root.dataset.theme = saved;
          root.style.colorScheme = saved === 'tech' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
